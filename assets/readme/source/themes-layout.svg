<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Actual dark and light DSH screenshots</title>
  <desc id="desc">Maintainer-provided screenshots show the reasoning slider, runner, level markers and model badge in dark and light themes.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#080B16"/><stop offset=".5" stop-color="#121735"/><stop offset="1" stop-color="#EDF4FF"/></linearGradient>
    <clipPath id="dark"><rect x="30" y="78" width="550" height="230" rx="20"/></clipPath>
    <clipPath id="light"><rect x="620" y="78" width="550" height="230" rx="20"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="38" y="45" font-size="20" fill="#AEBBEB">DARK · BLUE / VIOLET</text>
    <text x="628" y="45" font-size="20" fill="#36508F">LIGHT · BLUE / WHITE</text>
    <g clip-path="url(#dark)"><rect x="30" y="78" width="550" height="230" fill="#141414"/><image href="dsh-dark-popup.png" x="30" y="78" width="550" height="230" preserveAspectRatio="xMidYMid meet"/></g>
    <g clip-path="url(#light)"><rect x="620" y="78" width="550" height="230" fill="#fff"/><image href="dsh-light-popup.png" x="620" y="78" width="550" height="230" preserveAspectRatio="xMidYMid meet"/></g>
    <text x="600" y="339" text-anchor="middle" fill="#8C9ABD" font-size="16">ACTUAL SCREENSHOTS · Level names and count follow the model</text>
  </g>
</svg>
